name: validate-demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout demo
        uses: actions/checkout@v4

      - name: Checkout provider
        uses: actions/checkout@v4
        with:
          repository: majestyz3/terraform-provider-bland
          path: terraform-provider-bland

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: terraform-provider-bland/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build and install local provider
        env:
          PROVIDER_SOURCE_DIR: terraform-provider-bland
        run: bash scripts/install-provider.sh

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Start mock Bland API
        run: |
          python3 scripts/mock_bland.py >/tmp/mock-bland.log 2>&1 &
          echo $! >/tmp/mock-bland.pid
          sleep 1

      - name: Terraform apply against mock API
        env:
          BLAND_API_KEY: ci-test-key
          BLAND_BASE_URL: http://127.0.0.1:18080
        run: terraform apply -auto-approve

      - name: Idempotency check against mock API
        env:
          BLAND_API_KEY: ci-test-key
          BLAND_BASE_URL: http://127.0.0.1:18080
        run: terraform plan -detailed-exitcode

      - name: Terraform destroy against mock API
        env:
          BLAND_API_KEY: ci-test-key
          BLAND_BASE_URL: http://127.0.0.1:18080
        run: terraform destroy -auto-approve

      - name: Show mock API log on failure
        if: failure()
        run: cat /tmp/mock-bland.log || true
